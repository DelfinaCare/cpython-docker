# Tests every CPython version on every platform, exactly as released, but
# with aggressive caching. Pushes to main run it too: a PR can read the
# caches of its base branch, so that keeps PR builds warm.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Re-download everything pinned and check it against the pinned sha256 and
  # the signatures and checksums upstream publishes. Catches a version or
  # sha256 edited by hand without scripts/update-deps.py.
  verify-pins:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install --require-hashes -r scripts/requirements.txt
      - run: python scripts/update-deps.py --verify-pins
        env:
          # Optional: avoids Docker Hub's anonymous rate limit. Not available
          # to PRs from forks, which then use the anonymous limit.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pythons: ${{ steps.plan.outputs.pythons }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: bash .github/scripts/plan.sh >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: test ${{ matrix.version }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One GitHub Actions cache scope per CPython version and platform. Each
      # job also reads the other versions' scopes for its platform: the
      # dependency stages don't depend on the CPython version, so they're
      # shared.
      - name: Cache scopes
        id: cache
        env:
          PYTHONS: ${{ needs.plan.outputs.pythons }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "from<<EOF"
            jq -r --arg arch "$ARCH" '.[] | "type=gha,scope=\(.minor)-\($arch)"' <<<"$PYTHONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The test stage runs on top of the runtime image, so this builds and
      # tests everything a release would.
      - name: Build and test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: ${{ matrix.platform }}
          build-args: |
            PYTHON_VERSION=${{ matrix.version }}
            PYTHON_SHA256=${{ matrix.sha256 }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: type=gha,scope=${{ matrix.minor }}-${{ matrix.arch }},mode=max,ignore-error=true
          outputs: type=cacheonly
